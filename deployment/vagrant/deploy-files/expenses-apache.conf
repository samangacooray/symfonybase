# Symfony API on port 8080
<VirtualHost 192.168.30.4:8080>
  ServerName dev.expenses.com
  DocumentRoot "/var/www/html/slayd/current/expense/public"

  <Directory /var/www/html/slayd/current/expense/public>
    Options +FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>

# Angular SPA on port 80 — proxies /api to Symfony
<VirtualHost 192.168.30.4:80>
  ServerName dev.expenses.com
  DocumentRoot "/var/www/html/slayd/current/expense-spa/dist/expense-spa/browser"

  <Directory /var/www/html/slayd/current/expense-spa/dist/expense-spa/browser>
    Options +FollowSymLinks
    AllowOverride None
    Require all granted
    # Angular HTML5 routing fallback
    FallbackResource /index.html
  </Directory>

  # Forward /api requests to Symfony
  ProxyPreserveHost On
  ProxyPass        /api http://127.0.0.1:8080/api
  ProxyPassReverse /api http://127.0.0.1:8080/api
</VirtualHost>
